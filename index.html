<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぷよぷよ対戦ゲーム</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-boards">
            <!-- プレイヤー1のボード -->
            <div class="board-wrapper player1-board">
                <div class="board-container">
                    <div class="next-side-container">
                        <div class="next-puyo-display">
                            <canvas id="next1-1" width="180" height="300"></canvas>
                        </div>
                        <div class="next-puyo-display">
                            <canvas id="next1-2" width="180" height="300"></canvas>
                        </div>
                    </div>
                    <div class="board-main">
                        <canvas id="board1" width="720" height="1440"></canvas>
                        <div class="ojama-indicator" id="ojama1">
                            <div class="ojama-text">おじゃま: <span id="ojama1-count">0</span></div>
                        </div>
                        <div class="score-display">
                            <div class="score" id="score1">0000000</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 中央エリア -->
            <div class="center-area">
                <div class="vs-text">VS</div>
                <button id="startBtn" class="start-button">START</button>
                <div class="difficulty-selector">
                    <div class="difficulty-title">CPUの強さ</div>
                    <div class="difficulty-options">
                        <label class="difficulty-option">
                            <input type="radio" name="difficulty" value="easy">
                            <span>よわい</span>
                        </label>
                        <label class="difficulty-option">
                            <input type="radio" name="difficulty" value="normal" checked>
                            <span>ふつう</span>
                        </label>
                        <label class="difficulty-option">
                            <input type="radio" name="difficulty" value="hard">
                            <span>つよい</span>
                        </label>
                    </div>
                </div>
                <div class="controls">
                    <div class="control-info" aria-labelledby="controls-title">
                        <div id="controls-title" class="control-title">操作方法</div>
                        <table class="control-table">
                            <tr>
                                <th> 移　動 </th>
                                <td><kbd>←</kbd> <kbd>→</kbd></td>
                            </tr>
                            <tr>
                                <th>高速落下</th>
                                <td><kbd>↓</kbd></td>
                            </tr>
                            <tr>
                                <th> 回　転 </th>
                                <td><kbd>Z</kbd> / <kbd>X</kbd></td>
                            </tr>
                        </table>
                    </div>
                </div>
                <div id="gameOverText" class="game-over hidden"></div>
            </div>

            <!-- プレイヤー2（CPU）のボード -->
            <div class="board-wrapper player2-board">
                <div class="board-container">
        
                    <div class="board-main">
                        <canvas id="board2" width="720" height="1440"></canvas>
                        <div class="ojama-indicator" id="ojama2">
                            <div class="ojama-text">おじゃま: <span id="ojama2-count">0</span></div>
                        </div>
                        <div class="score-display">
                            <div class="score" id="score2">0000000</div>
                        </div>
                    </div>
                    <div class="next-side-container">
                        <div class="next-puyo-display">
                            <canvas id="next2-1" width="180" height="300"></canvas>
                        </div>
                        <div class="next-puyo-display">
                            <canvas id="next2-2" width="180" height="300"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="game-footer">
            <div class="player-info player1-info">
                <img src="assets/images/icon.png" alt="Player" class="player-icon">
                <div class="player-details">
                    <div class="player-name">PLAYER</div>
                </div>
            </div>
            <div class="win-indicator">
                <span id="player1Stars" class="win-stars">☆☆</span>
                <span class="win-label">WIN</span>
                <span id="player2Stars" class="win-stars">☆☆</span>
            </div>
            <div class="player-info player2-info">
                <div class="player-details">
                    <div class="player-name">COMPUTER</div>
                </div>
                <img src="assets/images/icon2.png" alt="Computer" class="player-icon">
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
